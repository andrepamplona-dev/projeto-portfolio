<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>André Pamplona | Projetos</title>
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <script src="../../js/script.js" defer></script>

        <style>
        /* ==================== SEÇÃO FERRAMENTAS - FILTROS ==================== */
        .secao-ferramentas {
            display: flex;
            flex-wrap: wrap;
            gap: var(--gap-pequeno);
            padding: var(--espacamento-base);        
          }

        .tag {
          border-color: var(--cor-menos-importante);
            position: relative;
            padding: var(--espacamento-base);
            background-color: transparent;
            color: var(--cor-importante);
            border-radius: var(--radius-medio);
            font-size: var(--fonte-para-secundaria);
            font-weight: var(--peso-medium);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            overflow: hidden;
        }

        .tag:hover {
          background: var(--cor-destaque);
            color: var(--cor-escura);
            border-color: var(--cor-destaque);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.2);
        }

        .tag:active {
            transform: translateY(0);
        }

        .filtro-ativo {
            font-weight: var(--peso-regular);
            background-color: var(--cor-destaque);
            color: var(--cor-escura);
            border-color: var(--cor-destaque);
            box-shadow: 0 4px 15px var(--cor-destaque 0.3);
        }

        .filtro-ativo:hover{
            color: var(--cor-escura);
            transform: translateY(-2px);
        }

        </style>
      </head>
<body>

  <header>
    <a href="../../../index.html" class="logo">André Pamplona</a>

    <button class="menu-toggle" aria-label="Abrir menu">☰</button>
            
        <div class="theme-toggle-container">
        <label class="switch">
          <input type="checkbox" id="theme-switch">
            <div class="switch-track">
            <div class="switch-thumb">
              <i class="fa-solid fa-sun sun-icon"></i>
              <i class="fa-solid fa-moon moon-icon"></i>
            </div>
          </div>
        </label>
        </div>

    <ul class="menu">
        <li><a href="../../../index.html">Inicio</a></li>
        <li><a href="../resumo.html">Resumo</a></li>
        <li><a href="projetos.html" class="ativo">Projetos</a></li>
        <li><a href="../contato.html">Contato</a></li>
    </ul>
</header>

<section class="intro-page"> 
  <h1>Projetos</h1>
  <span>Alguma frase aqui, moral</span>
</section>

<section class="filtragem-projetos fade-element">
            <div class="barra-pesquisa">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Busque por projetos..." aria-label="Campo de busca">
            </div>

            <div class="secao-ferramentas">
                <button class="tag filtro-ativo" id-filtro="todos">Todos</button>
                <button class="tag" id-filtro="design">Design</button>
                <button class="tag" id-filtro="desenvolvimento">Desenvolvimento</button>
                <button class="tag" id-filtro="social">Projetos Sociais</button>
            </div>
        </section>

<section class="portfolio-de-projetos">

</section>

  <footer>
    <div class="linha-final"></div>
    <div class="info-final">
      <div class="info-redes-sociais">
        <a href="https://www.instagram.com/_andrepamplona/" target="_blank">Instagram</a>
        <a href="https://www.linkedin.com/in/andr%C3%A9-pamplona-04674035a/" target="_blank">Linkedin</a>
        <a href="https://wa.me/5583996083346" target="_blank">Whatsapp</a>
      </div>
    
      <div class="info-direitos">
        <p>©2025 Todos os direitos reservados a André Pamplona.</p>
      </div>
    </div>
</footer>

<script src="../../js/portfolio.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.querySelector('.menu-toggle');
    const menu = document.querySelector('.menu');

    if (toggle && menu) {
      toggle.addEventListener('click', () => {
        menu.classList.toggle('show');
      });
    }
  });
</script>

</body>
</html>
